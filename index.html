    <!--
      Open Graph ESTÁTICO.
      Os robôs de preview do WhatsApp, Facebook e Instagram não executam
      JavaScript, então leem apenas o que está aqui — as tags por rota do
      componente <Seo> não chegam neles. Ao trocar de domínio, atualize as
      URLs absolutas abaixo E a constante SITE_URL em src/lib/brand.ts.
    -->
    <meta data-seo-estatico property="og:type" content="website" />
    <meta data-seo-estatico property="og:site_name" content="Simone Sá Atelier" />
    <meta data-seo-estatico property="og:locale" content="pt_BR" />
    <meta data-seo-estatico property="og:title" content="Simone Sá Atelier | Alta-costura sob medida" />

      data-seo-estatico
      property="og:description"
      content="Vestidos de noiva, festa e sob medida com modelagem própria e acabamento à mão."
    />
    <meta data-seo-estatico property="og:url" content="https://simone-sa-atelier.vercel.app/" />
    <meta data-seo-estatico property="og:image" content="https://simone-sa-atelier.vercel.app/og-image.jpg" />
